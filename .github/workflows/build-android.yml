# בונה את אפליקציית האנדרואיד בענן של GitHub בכל push, ומפרסם קישור הורדה ישיר ל-APK
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # מאפשר להריץ ידנית מלשונית Actions

permissions:
  contents: write # נדרש כדי לפרסם את ה-APK בדף ה-Releases

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Build web app (Vite)
        run: npm run build

      - name: Setup Java 21 (required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Copy web build into Android project
        run: npx cap sync android

      # Maven Central לפעמים חוסם את שרתי GitHub (שגיאה 429). מורידים קודם מהמראה של Google,
      # ושומרים את ההורדות ב-cache כדי שבנייה הבאה כמעט לא תצטרך להוריד כלום.
      - name: Use Google's Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-mirror.gradle <<'GRADLE'
          def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2/'
          allprojects {
              buildscript {
                  repositories {
                      maven { url mirrorUrl }
                  }
              }
              repositories {
                  maven { url mirrorUrl }
              }
          }
          GRADLE

      - name: Build APK (with automatic retries)
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "::group::Gradle attempt $attempt"
            if ./gradlew assembleDebug --no-daemon \
                 -Dorg.gradle.internal.repository.max.retries=8 \
                 -Dorg.gradle.internal.repository.initial.backoff=2000; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed – waiting before retry..."
            sleep $((attempt * 45))
          done
          exit 1

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk balance-app.apk

      - name: Publish to "latest" release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest balance-app.apk \
            --title "איזון יומי – גרסה ${{ github.run_number }}" \
            --notes "נבנה אוטומטית מ-commit ${{ github.sha }}. להורדה בטלפון: לחצי על balance-app.apk והתקיני." \
            --latest

      - name: Also keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: balance-app-apk
          path: balance-app.apk
          retention-days: 14
